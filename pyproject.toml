[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-cloning-eval"
version = "0.1.0"
description = "Evaluation framework for TTS and voice cloning models"
requires-python = ">=3.10"

dependencies = [
    "websockets>=13.0",
    "msgpack>=1.0.0",
    "pydub>=0.25.1",
    "pedalboard>=0.8.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "python-dotenv>=1.0.0",
    "soundfile>=0.12.0",
    "mistralai>=0.0.7",
    "mutagen>=1.47.0",
    "dashscope>=1.20.0",
    "num2words>=0.5.13",
    "requests>=2.31.0",
]

[project.scripts]
voxtral-synthesize = "myecho.cli.voxtral_synthesize:main"
s2pro-synthesize = "myecho.cli.s2pro_synthesize:main"
qwen3-synthesize = "myecho.cli.qwen3_synthesize:main"

[tool.hatch.build.targets.wheel]
packages = ["src/myecho"]

[project.optional-dependencies]
eval = [
    "jiwer>=3.0.0",
    "openai-whisper>=20240314",
    "speechbrain>=1.0.0",
    "torch>=2.13.0",
    "torchaudio>=2.0.0",
    # BS.1770 loudness, for normalizing listening-test stimuli
    "pyloudnorm>=0.1.0",
    # Confirmatory mixed models in analyze_listening_test.py. Optional at
    # runtime: without it the bootstrap intervals are still computed.
    "statsmodels>=0.14.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
]
notebook = [
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "plotly>=5.0.0",
    "pandas>=2.0.0",
    "soundfile>=0.12.0",
    "pyloudnorm>=0.1.0",
    "scikit-learn>=1.3.0",
    "transformers==5.15.0",
    "torch>=2.13.0",
    "IPython>=8.0.0",
    "seaborn>=0.13.0",
]
